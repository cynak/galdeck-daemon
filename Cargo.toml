[workspace]
resolver = "2"
members = [
  "crates/galdeck-daemon",
  "crates/galdeck-device",
  "crates/galdeck-core",
  "crates/galdeck-http",
  "crates/galdeck-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/cynak/galdeck-daemon"
homepage = "https://github.com/cynak/galdeck-daemon"
authors = ["galdeck contributors"]

[workspace.dependencies]
# The hardware framework, published at https://crates.io/crates/galdeck.
# Pinned by Cargo.lock, which CI builds with --locked. For local work against
# an unpublished framework change, add to .cargo/config.toml (not committed):
#   [patch.crates-io]
#   galdeck = { path = "../galdeck" }
galdeck = "0.3.1"

# The control protocol and the configuration model, which belong to the CLI:
# https://github.com/cynak/galdeck-cli. The dependency runs one way only --
# the CLI is usable on its own, and this daemon plus its configuration UI is
# what needs it -- so nothing there may ever point back here.
#
# Both a version and a path, deliberately. The path is what a local build
# resolves, so the two repositories are checked out side by side:
#
#   ~/Code/galdeck-cli
#   ~/Code/galdeck-daemon
#
# The version is what `cargo publish` substitutes, because cargo strips `path`
# from a published manifest and refuses a dependency carrying no version.
galdeck-ipc = { version = "0.1.0", path = "../galdeck-cli/crates/galdeck-ipc" }
galdeck-model = { version = "0.1.0", path = "../galdeck-cli/crates/galdeck-model" }

galdeck-device = { path = "crates/galdeck-device" }
galdeck-core = { path = "crates/galdeck-core" }
galdeck-http = { path = "crates/galdeck-http" }
galdeck-plugin = { path = "crates/galdeck-plugin" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
ctrlc = { version = "3", features = ["termination"] }
jiff = "0.2"
libc = "0.2"
# Widgets. D-Bus reaches media players over MPRIS; its blocking API runs its
# own executor, so nothing here grows an async runtime.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# Weather. rustls rather than native-tls so a build needs no OpenSSL headers.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
strip = true
