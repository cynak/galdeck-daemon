[workspace]
resolver = "2"
members = [
  "crates/galdeck-daemon",
  "crates/galdeck-cli",
  "crates/galdeck-ipc",
  "crates/galdeck-device",
  "crates/galdeck-core",
  "crates/galdeck-model",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/cynak/galdeck-daemon"
homepage = "https://github.com/cynak/galdeck-daemon"
authors = ["galdeck contributors"]

[workspace.dependencies]
# The hardware framework. Switch to a version once galdeck is published.
galdeck = { path = "../galdeck" }
galdeck-ipc = { path = "crates/galdeck-ipc" }
galdeck-device = { path = "crates/galdeck-device" }
galdeck-core = { path = "crates/galdeck-core" }
galdeck-model = { path = "crates/galdeck-model" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
