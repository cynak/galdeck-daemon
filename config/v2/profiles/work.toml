name = "Work"
theme = "nord"
home = "main"

# Style set here applies to every page in this profile, and is overridden by
# anything a page or an individual key sets.
[style]
key_label_size = 24.0

[[pages]]
id = "main"
lcd_text = "work"

[[pages.keys]]
key = 0
label = "Terminal"
exec = "x-terminal-emulator || kitty || alacritty || gnome-terminal"

# A key can answer differently to a tap, a hold and a double tap. Binding
# either of the latter two changes when `exec` fires: until the key is
# released nobody knows which gesture it was. A key with neither still fires
# the instant it goes down.
[[pages.keys]]
key = 1
label = "Browser"
exec = "xdg-open https://example.com"
hold = "xdg-open https://example.com/settings"
double = "xdg-open about:blank"

[[pages.keys]]
key = 2
label = "Media"
page = "media"

# A per-key override sits at the top of the cascade.
[pages.keys.style]
key_bg = "@aurora-green"

[[pages.keys]]
key = 11
label = "Play"
profile = "play"

# Animations pre-render their frames when the page is applied, so playing one
# costs nothing at runtime. `kind` is pulse, breathe or blink; `to` is the
# colour it moves towards, defaulting to white.
[pages.keys.animation]
kind = "breathe"
period_ms = 3000
to = "@aurora-green"

# A widget makes a key show something that changes. Its text replaces the
# label once it has produced one; until then the label is what shows.
#
#   clock / date   the time, formatted with `format`
#   cpu / memory   percentage in use
#   command        the first line of a shell command's output
#
# Cheap widgets are read inline. A command runs on a worker thread and is
# killed if it takes more than five seconds, so a wedged script cannot hold
# up the deck.
[[pages.keys]]
key = 9
label = "--:--"
exec = "true"

[pages.keys.widget]
kind = "clock"
format = "%H:%M"

[[pages.keys]]
key = 10
label = "cpu"
exec = "true"

[pages.keys.widget]
kind = "cpu"
interval_ms = 2000

# A plugin owns this key's text and colour. Plugins are separate processes
# under `plugins/<id>/`, speaking line-delimited JSON over stdin and stdout --
# see plugins/counter/ for one in forty lines of Python.
[[pages.keys]]
key = 6
label = "0"

[pages.keys.plugin]
id = "counter"

[pages.keys.plugin.options]
label = "presses"

[[pages.encoders]]
encoder = 0
press = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
cw = "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 2%+"
ccw = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-"

[[pages]]
id = "media"
lcd_text = "media"

[[pages.keys]]
key = 0
label = "Play"
exec = "playerctl play-pause"

[[pages.keys]]
key = 1
label = "Next"
exec = "playerctl next"

[[pages.keys]]
key = 2
label = "Back"
# Returns to whichever page this one was reached from.
back = true

[pages.keys.style]
key_bg = "@aurora-red"

[[pages.encoders]]
encoder = 1
cw = "playerctl position 5+"
ccw = "playerctl position 5-"
