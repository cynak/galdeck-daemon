name = "Work"
theme = "nord"
home = "main"

# Style set here applies to every page in this profile, and is overridden by
# anything a page or an individual key sets.
[style]
key_label_size = 24.0

[[pages]]
id = "main"
lcd_text = "work"

[[pages.keys]]
key = 0
label = "Terminal"
exec = "x-terminal-emulator || kitty || alacritty || gnome-terminal"

# A key can answer differently to a tap, a hold and a double tap. Binding
# either of the latter two changes when `exec` fires: until the key is
# released nobody knows which gesture it was. A key with neither still fires
# the instant it goes down.
[[pages.keys]]
key = 1
label = "Browser"
exec = "xdg-open https://example.com"
hold = "xdg-open https://example.com/settings"
double = "xdg-open about:blank"

[[pages.keys]]
key = 2
label = "Media"
page = "media"

# A per-key override sits at the top of the cascade.
[pages.keys.style]
key_bg = "@aurora-green"

[[pages.keys]]
key = 11
label = "Play"
profile = "play"

# Animations pre-render their frames when the page is applied, so playing one
# costs nothing at runtime. `kind` is pulse, breathe or blink; `to` is the
# colour it moves towards, defaulting to white.
[pages.keys.animation]
kind = "breathe"
period_ms = 3000
to = "@aurora-green"

# A widget makes a key show something that changes. Its text replaces the
# label once it has produced one; until then the label is what shows.
#
#   clock / date   the time, formatted with `format`
#   cpu / memory   percentage in use
#   command        the first line of a shell command's output
#
# Cheap widgets are read inline. A command runs on a worker thread and is
# killed if it takes more than five seconds, so a wedged script cannot hold
# up the deck.
[[pages.keys]]
key = 9
label = "--:--"
exec = "true"

[pages.keys.widget]
kind = "clock"
format = "%H:%M"

[[pages.keys]]
key = 10
label = "cpu"
exec = "true"

[pages.keys.widget]
kind = "cpu"
interval_ms = 2000

# A plugin owns this key's text and colour. Plugins are separate processes
# under `plugins/<id>/`, speaking line-delimited JSON over stdin and stdout --
# see plugins/counter/ for one in forty lines of Python.
[[pages.keys]]
key = 6
label = "0"

[pages.keys.plugin]
id = "counter"

[pages.keys.plugin.options]
label = "presses"

# The left knob is volume everywhere (see galdeck.toml). This page gives the
# right one to its pages.
[[pages.encoders]]
encoder = 1
preset = "pages"

[[pages]]
id = "media"

# A background behind the screen, the keys, or both. `both` is one picture
# across the whole panel, placed by the calibration, so it runs from the
# screen down through the keycaps. A theme can carry one too; the nearest
# wins. Uncomment to try an animated one:
#
# [pages.background]
# span = "both"
# animation = "aurora"     # aurora, gradient, waves, plasma -- or `image`
# fps = 10
# dim = 0.3

# The info screen can show widgets instead of text. It is a grid of 12
# columns by 6 rows, each 60x64 pixels; a tile names its top-left cell and
# how many it spans, and sits on a card a shade off the screen's background.
#
# `media` follows whichever MPRIS player is playing -- Spotify, a browser,
# mpv -- or the one named by `source`. It shows the cover, title, artist and
# progress; the controls are still ordinary keys below.
[[pages.lcd]]
column = 0
row = 0
columns = 12
rows = 4

[pages.lcd.widget]
kind = "media"
color = "@accent"

[[pages.lcd]]
column = 0
row = 4
columns = 6
rows = 2

[pages.lcd.widget]
kind = "clock"

# Anything that measures something can be a `graph` of recent readings or a
# `bar`, as well as plain text. `color` is the one colour a widget may pick;
# everything else comes from the theme.
[[pages.lcd]]
column = 6
row = 4
columns = 6
rows = 2

[pages.lcd.widget]
kind = "cpu"
view = "graph"
color = "@aurora-red"

# A media widget on a key shows the cover, with progress along the bottom.
# With nothing else bound, tapping it plays and pauses what it shows.
[[pages.keys]]
key = 0
label = "Play"

[pages.keys.widget]
kind = "media"

[[pages.keys]]
key = 1
label = "Next"
# Any gesture can be a shell command, something built in, or keystrokes:
#   exec = "firefox"
#   exec = { action = "next_track" }
#   exec = { keys = "ctrl+shift+t" }
exec = { action = "next_track" }

[[pages.keys]]
key = 2
label = "Back"
# Returns to whichever page this one was reached from.
back = true

[pages.keys.style]
key_bg = "@aurora-red"

[[pages.encoders]]
encoder = 1
preset = "seek"
step = 5
