name = "Play"
theme = "nord-bright"
home = "main"

[[pages]]
id = "main"
lcd_text = "play"

[[pages.keys]]
key = 0
label = "Steam"
exec = "steam"

[[pages.keys]]
key = 11
label = "Work"
profile = "work"

# The knob is still volume, from galdeck.toml; this page only adds an
# animation to its ring.
[[pages.encoders]]
encoder = 0

# Rings can animate too, and cost nothing to do so: a ring frame is four
# colours with no image encoding at all. Turning or clicking the knob still
# takes precedence -- an animation must not hide what the knob is doing.
[pages.encoders.animation]
kind = "comet"
period_ms = 2400
