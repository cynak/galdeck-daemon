# A theme is a palette plus a set of style defaults.
#
# Anywhere a colour is expected you may write `#rrggbb` or `@name`, where the
# name is one of the palette entries below. Tokens may point at other tokens;
# they are resolved once when the theme loads.

name = "Nord"

[palette]
polar = "#2e3440"
storm = "#3b4252"
frost = "#88c0d0"
snow = "#eceff4"
aurora-red = "#bf616a"
aurora-yellow = "#ebcb8b"
aurora-green = "#a3be8c"
# A token pointing at another token: change `frost` and this follows.
accent = "@frost"
# What a widget turns past its `warn` and `critical` thresholds, and what a
# muted key or a finished timer shows.
warning = "@aurora-yellow"
critical = "@aurora-red"

[style]
key_bg = "@storm"
key_label_color = "@snow"
key_label_size = 26.0
# Height of the strip at the bottom of a key reserved for its label.
key_label_strip = 36
lcd_bg = "@polar"
lcd_text_color = "@snow"
lcd_text_size = 56.0
ring = "@accent"

# How widgets look under this theme. Left out here, so they draw the way
# they always have; take the `#` off to try some. A widget's own settings
# still win, and a profile or a page can have a [widgets] of its own.
#
# [widgets]
# graph = "line"        # area (the usual), line or bars
# bar = "segmented"     # rounded (the usual), flat or segmented
# sweep = 240           # how far round a dial goes, 90 to 360 degrees
#
# [widgets.clock]       # every clock, over the settings above
# view = "nixie"
# color = "@aurora-yellow"

# How things move under this theme. Also left out, so nothing does.
#
# [motion]
# press = { kind = "flash", color = "@accent" }   # or "dim"; `ms` to fade
# alarm = { kind = "pulse", period_ms = 900 }     # past a widget's threshold
# rings = { kind = "breathe", period_ms = 4000 }  # every knob at rest
