name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The framework is a path dependency until it is published, and Cargo.lock
  # cannot pin a path dependency. Without a fixed revision here, an unrelated
  # commit to the framework reddens an unrelated pull request in this repo.
  # Bump this deliberately, in a commit that says why.
  GALDECK_FRAMEWORK_REV: 4cb2a16a46d098e7e9f10a4bcca09d3ef72ba0e0

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: galdeck-daemon
      - uses: actions/checkout@v4
        with:
          repository: cynak/galdeck
          ref: ${{ env.GALDECK_FRAMEWORK_REV }}
          path: galdeck
      - name: Install libudev headers
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: galdeck-daemon
      - name: Format
        working-directory: galdeck-daemon
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: galdeck-daemon
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        working-directory: galdeck-daemon
        run: cargo test --workspace --locked

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: galdeck-daemon
      - uses: actions/checkout@v4
        with:
          repository: cynak/galdeck
          ref: ${{ env.GALDECK_FRAMEWORK_REV }}
          path: galdeck
      - name: Install libudev headers
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # Pinned to the workspace's rust-version. `image` declares exactly this
      # floor, so a dependency bump can break it silently; this job is the
      # canary.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: galdeck-daemon
      - name: Check
        working-directory: galdeck-daemon
        run: cargo check --workspace --all-targets --locked

  layering:
    name: layering invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: ./ci/layering.sh
