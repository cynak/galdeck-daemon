name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hidapi builds a C shim against these.
      - name: Install libudev headers
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # --locked throughout: the framework and `image` are both pinned by
      # Cargo.lock, and `image` declares exactly our MSRV floor, so an
      # unnoticed update is how the MSRV job would start failing mysteriously.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libudev headers
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # Pinned to the workspace's rust-version. `image` declares exactly this
      # floor, so a dependency bump can break it silently; this job is the
      # canary.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --locked

  layering:
    name: layering invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: ./ci/layering.sh
