name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of this first, on the tagged commit.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

# This repository does not build alone. The control protocol and the
# configuration model come from cynak/galdeck-cli, by relative path, so every
# job checks out both.
#
# actions/checkout can only place a repository somewhere under
# $GITHUB_WORKSPACE, which means neither of them can sit at the root: they go
# into named directories beside each other, and every cargo step then runs
# with working-directory: galdeck-daemon so that `../galdeck-cli/...` resolves.
#
# The lockfile cannot pin what comes across -- a path dependency is recorded
# without a source -- so these jobs build against whatever the CLI's default
# branch holds. That is the price of depending on it before it is published;
# pin `ref:` below if a red build ever needs to be reproduced exactly.

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: galdeck-daemon
      - uses: actions/checkout@v4
        with:
          repository: cynak/galdeck-cli
          path: galdeck-cli
      # hidapi builds a C shim against these.
      - name: Install libudev headers
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: galdeck-daemon
      - name: Format
        working-directory: galdeck-daemon
        run: cargo fmt --all --check
      # --locked throughout: the framework and `image` are both pinned by
      # Cargo.lock, and `image` declares exactly our MSRV floor, so an
      # unnoticed update is how the MSRV job would start failing mysteriously.
      - name: Clippy
        working-directory: galdeck-daemon
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        working-directory: galdeck-daemon
        run: cargo test --workspace --locked

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: galdeck-daemon
      - uses: actions/checkout@v4
        with:
          repository: cynak/galdeck-cli
          path: galdeck-cli
      - name: Install libudev headers
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # Pinned to the workspace's rust-version. `image` declares exactly this
      # floor, so a dependency bump can break it silently; this job is the
      # canary.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: galdeck-daemon
      - name: Check
        working-directory: galdeck-daemon
        run: cargo check --workspace --all-targets --locked

  layering:
    name: layering invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: galdeck-daemon
      # Checked out because one of the invariants reads the CLI's manifests to
      # confirm the dependency has not been pointed back this way. Without it
      # that check skips, and a check that skips proves nothing.
      - uses: actions/checkout@v4
        with:
          repository: cynak/galdeck-cli
          path: galdeck-cli
      - name: Check
        working-directory: galdeck-daemon
        run: ./ci/layering.sh
